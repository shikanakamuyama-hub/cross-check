<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2点照合">
<meta name="theme-color" content="#44546A">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>2点照合ツール</title>
<style>
:root {
  color-scheme: light;
  --bg: #F2F3F5;
  --card: #FFFFFF;
  --text: #1F2328;
  --sub: #5B6370;
  --line: #D0D4DA;
  --head: #44546A;
  --accent: #2F75B5;
  --ok-bg: #C6EFCE; --ok-text: #006100;
  --ng-bg: #FFC7CE; --ng-text: #9C0006;
  --warn-bg: #FFEB9C; --warn-text: #7A5200;
  --tab-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  font-size: 17px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body { padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 980px; margin: 0 auto; padding: 12px 16px 24px;
  padding-top: calc(12px + env(safe-area-inset-top)); }
h1 { font-size: 22px; margin: 4px 0 12px; }
h2 { font-size: 18px; margin: 18px 0 8px; }
.card { background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.muted { color: var(--sub); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 52px;
  padding: 6px 18px; text-align: center; line-height: 1.3; border-radius: 12px; border: 1px solid var(--line); background: var(--card);
  font-weight: 600; }
.btn:active { filter: brightness(.92); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.danger { background: #fff; color: #C00000; border-color: #E6A3A3; }
.btn.block { display: flex; width: 100%; }
.btn.small { min-height: 40px; padding: 0 12px; font-size: 15px; border-radius: 10px; }
.btn:disabled { opacity: .35; }
.field { display: block; margin-bottom: 12px; }
.field > span { display: block; font-size: 14px; color: var(--sub); margin-bottom: 4px; }
.input { width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--line);
  border-radius: 12px; background: #fff; font-size: 18px; }
.input:focus { outline: 3px solid rgba(47,117,181,.35); border-color: var(--accent); }
select.input { -webkit-appearance: none; appearance: none; }

/* 読取画面 */
/* いま読むもの：① かんばん＝青 k、② 社内ラベル＝オレンジ l。スクロールしても上に残す */
.now { position: sticky; top: 0; z-index: 5; border-radius: 14px; padding: 10px 14px; color: #fff; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.now.k { background: #2F75B5; }
.now.l { background: #C55A11; }
.now.f { background: #548235; }
/* 出荷照合／フリー在庫照合の切り替え */
.workbar { display: flex; gap: 8px; margin-bottom: 8px; }
.workbar button { flex: 1; min-width: 0; min-height: 46px; border: 2px solid var(--line); border-radius: 10px; background: #fff; color: var(--sub); font-size: 16px; font-weight: 700; }
.workbar button.sel { color: #fff; }
.workbar button.sel.ship { background: var(--head); border-color: var(--head); }
.workbar button.sel.free { background: #548235; border-color: #548235; }
.now .ns { font-size: 14px; opacity: .92; }
.now .nhow { font-size: 16px; font-weight: 700; }
.now .nw { font-size: 22px; font-weight: 800; line-height: 1.25; }
@media (max-width: 400px) { .now .nw { font-size: 20px; letter-spacing: -0.5px; } }
.now .nk { display: flex; gap: 10px; align-items: center; }
.now .ni { font-size: 15px; font-weight: 700; word-break: break-all; }
.now .nh { font-size: 26px; font-weight: 800; line-height: 1.2; }
.now .nr { display: inline-flex; flex-wrap: wrap; gap: 0 12px; margin-top: 3px; padding: 1px 10px; border-radius: 8px; background: #fff; color: #1F2328; font-size: 24px; font-weight: 800; }
.now .nv { font-size: 30px; font-weight: 800; line-height: 1.15; word-break: break-all; }
.now .btn { background: #fff; color: #1F2328; border-color: transparent; flex: none; min-height: 34px; }
/* 作業者と出荷リスト（1行） */
.infobar { display: flex; gap: 8px; margin-bottom: 8px; }
.infobar button { flex: 1; min-width: 0; min-height: 40px; padding: 4px 10px; border-radius: 10px; border: 1px solid var(--line); background: #FFF8E6;
  font-size: 15px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.infobar button.empty { color: #C00000; }
.result { border-radius: 14px; padding: 14px 16px; font-size: 20px; font-weight: 700; min-height: 64px;
  background: #E7E9EC; color: var(--sub); word-break: break-all; }
.result.ok { background: var(--ok-bg); color: var(--ok-text); }
.result.ng { background: var(--ng-bg); color: var(--ng-text); }
.result.warn { background: var(--warn-bg); color: var(--warn-text); }
.result.wait { background: #DDEBF7; color: #1F4E79; }
.result small { display: block; font-size: 15px; font-weight: 400; }
.result .big { font-size: 26px; }
.result .remain { display: flex; flex-wrap: wrap; gap: 0 14px; font-size: 32px; font-weight: 800; line-height: 1.2; margin-top: 2px; }
.result .nohin { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 2px; }
.result .hinq { display: flex; flex-wrap: wrap; gap: 0 14px; align-items: baseline; margin-top: 4px; color: var(--text); font-size: 18px; font-weight: 400; }
.result .hinq b { font-size: 32px; font-weight: 800; line-height: 1.2; word-break: break-all; }
.result .subinfo { font-size: 14px; font-weight: 400; color: var(--sub); margin-top: 4px; }
/* 全部そろったとき */
.alldone { position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 1000; background: #0E6B0E; color: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 14px; }
.alldone .ad1 { font-size: 46px; font-weight: 800; line-height: 1.2; }
.alldone .ad2 { font-size: 22px; }
.alldone .ad3 { font-size: 18px; background: #FFEB9C; color: #7A5200; border-radius: 12px; padding: 8px 14px; }
.alldone .btn { background: #fff; color: #1F2328; border-color: transparent; min-width: 200px; font-size: 20px; }
.flash { animation: flash .5s; }
@keyframes flash { from { transform: scale(1.03); } to { transform: scale(1); } }
.cam { position: relative; background: #000; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; }
.cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .frame { position: absolute; left: 7%; top: 22%; width: 86%; height: 56%;
  border: 3px solid rgba(255,255,255,.9); border-radius: 12px; box-shadow: 0 0 0 999px rgba(0,0,0,.25); }
.cam .camMsg { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: #fff;
  font-size: 15px; text-shadow: 0 1px 2px #000; }
.cam .frame.k { border-color: #BDD7EE; }
.cam .frame.l { left: 24%; width: 52%; top: 12%; height: 76%; border-color: #F8CBAD; }
.cam .frame.f { left: 24%; width: 52%; top: 12%; height: 76%; border-color: #C5E0B4; }
.cam .camNow { position: absolute; left: 0; right: 0; top: 0; padding: 6px 8px; text-align: center; color: #fff; font-size: 18px; font-weight: 800; }
.cam .camNow.k { background: rgba(47,117,181,.88); }
.cam .camNow.l { background: rgba(197,90,17,.88); }
.cam .camNow.f { background: rgba(84,130,53,.88); }
.scan-grid { display: grid; gap: 12px; }
@media (min-width: 860px) {
  .scan-grid { grid-template-columns: 1fr 1fr; align-items: start; }
}
.modebar { display: flex; gap: 8px; margin: 4px 0 12px; }
.modebar button { flex: 1; min-width: 0; min-height: 48px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); font-size: 16px; font-weight: 700; }
.modebar button.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
.seg button { flex: 1; min-height: 46px; border: 0; background: #fff; font-weight: 600; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.sel { background: var(--head); color: #fff; }

/* 記録 */
.rec { display: flex; gap: 10px; align-items: stretch; padding: 10px 12px; border-radius: 12px;
  margin-bottom: 8px; border: 1px solid rgba(0,0,0,.08); background: #fff; width: 100%; text-align: left; }
.rec .no { font-size: 13px; color: var(--sub); min-width: 38px; }
.rec .main { flex: 1; min-width: 0; }
.rec .hin { font-size: 22px; font-weight: 800; word-break: break-all; }
.rec .qty { font-size: 22px; font-weight: 700; white-space: nowrap; align-self: center; }
.rec .meta { font-size: 13px; color: var(--sub); word-break: break-all; }
.rec.ng { background: var(--ng-bg); }
.rec.warn { background: #FFF6D5; }
.rec.cancel { background: #EDEDED; color: #8A8F98; }
.rec.cancel .hin, .rec.cancel .qty { text-decoration: line-through; }
.rec .msg { font-size: 14px; font-weight: 600; }
.rec.ng .msg { color: var(--ng-text); }
.rec.warn .msg { color: var(--warn-text); }
.tag { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 999px; background: rgba(0,0,0,.08); margin-right: 4px; }
.tag.ok { background: var(--ok-bg); color: var(--ok-text); }
.tag.ng { background: var(--ng-bg); color: var(--ng-text); }
.tag.warn { background: var(--warn-bg); color: var(--warn-text); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 15px; }
.chip.sel { background: var(--head); color: #fff; border-color: var(--head); }
.chipwrap { display: inline-flex; align-items: center; }
.chipwrap .chip { border-radius: 999px 0 0 999px; border-right: 0; }
.chipx { min-height: 40px; min-width: 40px; border: 1px solid var(--line); border-radius: 0 999px 999px 0; background: #F2F3F5; color: var(--sub); font-size: 18px; }

/* 照合状況 */
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.stat { border-radius: 12px; padding: 8px 10px; background: #F4F5F7; }
.stat b { display: block; font-size: 24px; line-height: 1.2; }
.stat small { color: var(--sub); font-size: 13px; }
.stat.ok { background: var(--ok-bg); } .stat.ng { background: var(--ng-bg); } .stat.warn { background: var(--warn-bg); }
.prog { display: block; width: 100%; text-align: left; border: 1px solid rgba(0,0,0,.08); border-radius: 12px;
  padding: 10px 12px; margin-bottom: 8px; background: #fff; }
.prog .top { display: flex; gap: 8px; align-items: baseline; }
.prog .nh { font-size: 18px; font-weight: 700; word-break: break-all; flex: 1; min-width: 0; }
.prog .st { font-size: 14px; font-weight: 700; padding: 1px 10px; border-radius: 999px; white-space: nowrap; }
.prog .meta { font-size: 13px; color: var(--sub); word-break: break-all; }
.prog .nums { display: flex; gap: 14px; flex-wrap: wrap; font-size: 15px; margin-top: 2px; }
.prog .nums b { font-size: 18px; }
.prog .bar { height: 6px; border-radius: 3px; background: #E3E5E8; margin-top: 6px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: #5B9B4B; }
.prog.s-done { background: #EEF7EA; } .prog.s-done .st { background: var(--ok-bg); color: var(--ok-text); }
.prog.s-part .st { background: #DDEBF7; color: #1F4E79; }
.prog.s-none .st { background: #E7E9EC; color: var(--sub); }
.prog.s-over { background: #FFF6D5; } .prog.s-over .st { background: var(--warn-bg); color: var(--warn-text); } .prog.s-over .bar i { background: #C9A227; }
.prog.s-out { background: #FFF6D5; } .prog.s-out .st { background: var(--warn-bg); color: var(--warn-text); }
.prog .warnline { color: var(--warn-text); font-size: 14px; font-weight: 600; }
.done-banner { background: var(--ok-bg); color: var(--ok-text); border-radius: 14px; padding: 14px 16px; font-size: 20px; font-weight: 700; margin-bottom: 12px; }

/* 設定 */
.tokens { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.errtxt { color: var(--ng-text); font-size: 14px; font-weight: 600; margin-top: 4px; }
.testbox { background: #F4F5F7; border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 15px; word-break: break-all; }

/* タブ */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #fff;
  border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
.tabs button { flex: 1; height: var(--tab-h); border: 0; background: none; font-size: 13px; color: var(--sub); }
.tabs button b { display: block; font-size: 22px; line-height: 1.1; }
.tabs button.sel { color: var(--accent); font-weight: 700; }

/* モーダル */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex;
  align-items: flex-end; justify-content: center; }
.modal { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; overflow-y: auto;
  border-radius: 18px 18px 0 0; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }
.banner.stale { background: #FFEB9C; border: 2px solid #C9A227; font-size: 16px; }
.banner { background: #FFF2CC; border: 1px solid #E5C76B; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 15px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" id="tabs">
  <button data-tab="scan"><b>▣</b>読取</button>
  <button data-tab="prog"><b>✓</b>照合状況</button>
  <button data-tab="list"><b>☰</b>記録</button>
  <button data-tab="set"><b>⚙</b>設定</button>
</nav>
<div id="modalRoot"></div>
<script src="jsQR.js"></script>
<script src="zxing.min.js"></script>
<script src="pako.min.js"></script>
<script src="qrcode.js"></script>
<script src="qrlink.js"></script>
<script>
"use strict";
/* 2点照合ツール（iPad・Android・Windows タブレット・スマホ版）
   出荷前に、1箱ごとに「納入かんばん（バーコード）」と「社内ラベル（QR：納品番号,品番,入数）」を読み、
   ・2つの納品番号が同じか（誤品）を調べる。違えば NG
   ・出荷リストの納品数と、納品番号ごとに読んだ入数の合計を比べる（過不足）
   出荷リストが古いことがあるので、リスト外・品番違い・数量オーバーは止めずに「注意」として記録する。
   記録は端末の中（localStorage）にだけ保存し、ネットには送らない。CSV でパソコンへ渡す。
   版1.6.0：「フリー在庫照合」を追加。フリー在庫の箱から引き抜いた品に貼った社内ラベルを、箱の「フリー在庫札」（QR＝品番だけ）と
   品番どうしで照合する。① 札 → ② 社内ラベル の順。出荷リストは使わない。記録は出荷照合の記録とは別（F、LS_FREE）。 */

var APP_VERSION = "1.8.0";   // 1.8.0：フリー在庫照合は品番照合だけ（1.7.0 の「引き抜いた数」の入力をやめた。数は札に手書き）
var IS_ANDROID = /Android/i.test(navigator.userAgent);
var IS_WINDOWS = /Windows/i.test(navigator.userAgent);
var LS_SET = "niten.settings.v1";
var LS_LIST = "niten.list.v1";
var LS_REC = "niten.records.v1";
var LS_FREE = "niten.free.v1";
// フリー在庫照合の記録CSV。出荷照合の記録として取り込まれないように「納品番号」「入数」の見出しを使わない
var FREE_CSV_HEAD = ["No.", "日時", "作業者", "結果", "内容", "札の品番", "ラベルの品番", "ラベルの納品番号", "ラベルの入数",
  "札（読んだ内容）", "社内ラベル（読んだ内容）", "取消", "取消日時", "端末名", "ID"];
var DEFAULT_QR = "納品番号,品番,入数";
var KB_MODES = [
  { v: "whole", name: "全体が同じならOK（おすすめ）", memo: "かんばんの中身（納入品番＝納品番号）が、社内ラベルの納品番号と同じならOKにします。" },
  { v: "contains", name: "入っていればOK", memo: "かんばんの中のどこかに、社内ラベルの納品番号が入っていればOKにします（かんばんに余分な文字があるとき）。" },
  { v: "pos", name: "決まった位置から取り出す", memo: "かんばんの「何文字目から何文字」を納品番号として比べます。" },
  { v: "delim", name: "区切り文字で分けて取り出す", memo: "かんばんを区切り文字で分けた「何番目」を納品番号として比べます。" }
];
var CSV_HEAD = ["No.", "日時", "作業者", "結果", "注意", "納品番号", "品番", "入数", "かんばん（読んだ内容）", "社内ラベル（読んだ内容）",
  "取消", "取消日時", "出荷リスト", "端末名", "ID"];

var S = null;        // 設定
var L = null;        // 出荷リスト
var R = [];          // 記録
var F = [];          // フリー在庫照合の記録
var tab = "scan";
var saveError = "";
var listFilter = "";
var progFilter = "";
var lastResult = null;

/* ---------------- 保存 ---------------- */
function loadAll() {
  S = null; L = null; R = []; F = [];
  try { S = JSON.parse(localStorage.getItem(LS_SET) || "null"); } catch (e) { S = null; }
  try { L = JSON.parse(localStorage.getItem(LS_LIST) || "null"); } catch (e) { L = null; }
  try { R = JSON.parse(localStorage.getItem(LS_REC) || "[]") || []; } catch (e) { R = []; }
  try { F = JSON.parse(localStorage.getItem(LS_FREE) || "[]") || []; } catch (e) { F = []; }
  if (!S || typeof S !== "object") S = {};
  if (typeof S.tanto !== "string") S.tanto = "";
  if (!Array.isArray(S.tantos)) S.tantos = [];
  if (typeof S.device !== "string") S.device = "";
  if (typeof S.seq !== "number") S.seq = 0;
  if (typeof S.sound !== "boolean") S.sound = true;
  if (typeof S.camId !== "string") S.camId = "";
  if (S.input !== "camera" && S.input !== "scanner" && S.input !== "manual") S.input = "scanner";
  S.qrFmt = DEFAULT_QR;   // 社内ラベルのQRは3項目に固定（前の版で変えていても戻す）
  if (!S.kb || typeof S.kb !== "object") S.kb = {};
  if (!KB_MODES.some(function (m) { return m.v === S.kb.mode; })) S.kb.mode = "whole";
  // 版1.0.3：かんばんの中身は納入品番（＝納品番号）だけとわかったので、既定を「全体が同じならOK」にする（1回だけ切り替える）
  if (S.kbDefault !== 2) { if (S.kb.mode === "contains") S.kb.mode = "whole"; S.kbDefault = 2; }
  if (!(S.kb.start >= 1)) S.kb.start = 1;
  if (!(S.kb.len >= 1)) S.kb.len = 20;
  if (typeof S.kb.delim !== "string" || !S.kb.delim) S.kb.delim = ",";
  if (!(S.kb.index >= 1)) S.kb.index = 1;
  if (!S.pend || typeof S.pend !== "object" || S.pend.type !== "kanban") S.pend = null;
  if (!L || typeof L !== "object" || !Array.isArray(L.rows)) L = null;
  if (L && (!L.master || typeof L.master !== "object")) L.master = {};
  if (!Array.isArray(R)) R = [];
  if (!Array.isArray(F)) F = [];
  if (S.work !== "free") S.work = "ship";
  if (typeof S.fseq !== "number") S.fseq = 0;
  if (!S.fpend || typeof S.fpend !== "object" || !S.fpend.hinban) S.fpend = null;
  delete S.fwait;   // 1.7.0 の「引き抜いた数」待ち（1.8.0 でやめた）
}
function saveAll() {
  try {
    localStorage.setItem(LS_SET, JSON.stringify(S));
    localStorage.setItem(LS_LIST, JSON.stringify(L));
    localStorage.setItem(LS_REC, JSON.stringify(R));
    localStorage.setItem(LS_FREE, JSON.stringify(F));
    saveError = "";
  } catch (e) {
    saveError = "端末に保存できませんでした（" + e.message + "）。すぐに「記録をCSVで書き出す」をしてください。";

}

/* ---------------- 共通 ---------------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

}
function pad(n, w) { n = String(n); while (n.length < (w || 2)) n = "0" + n; return n; }
function nowText(d) {
  d = d || new Date();
  return d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " +
    pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
}
function stamp(d) {
  d = d || new Date();
  return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}
// 改行・タブを取り、全角の英数字・記号を半角にする（「、」はカンマとみなす）
function cleanText(s) {
  s = String(s == null ? "" : s).replace(/[\r\n\t]/g, "");
  var out = "";
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    if (c >= 0xFF01 && c <= 0xFF5E) out += String.fromCharCode(c - 0xFEE0);
    else if (c === 0x3000) out += " ";
    else if (c === 0x3001) out += ",";
    else out += s.charAt(i);
  }
  return out.trim();
}
// 日付を yyyy/mm/dd にそろえる（読めなければ ""）
function normDay(s) {
  var m = /^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/.exec(cleanText(s));
  return m ? m[1] + "/" + pad(parseInt(m[2], 10)) + "/" + pad(parseInt(m[3], 10)) : "";
}
// 比べるときの形（スペースを取り、英字を大文字にする）
function normKey(s) { return cleanText(s).replace(/\s+/g, "").toUpperCase(); }
function normalizeFormat(s) {
  s = cleanText(s);
  if (!s) return "";
  return s.split(",").map(function (t) { return t.trim(); }).join(",");
}
function formatError(fmt) {
  if (!fmt) return "QRの中身が空です";
  var t = fmt.split(","), nN = 0, nH = 0, nQ = 0;
  for (var i = 0; i < t.length; i++) {
    if (t[i] === "納品番号") nN++;
    else if (t[i] === "品番") nH++;
    else if (t[i] === "入数") nQ++;
    else if (t[i] !== "読まない") return "「" + t[i] + "」は使えません。納品番号・品番・入数・読まない のどれかにしてください";
  }
  if (nN !== 1 || nQ !== 1) return "納品番号と入数を1つずつ入れてください";
  if (nH > 1) return "品番は1つだけにしてください";
  return "";
}
function isQty(s) { return /^[0-9]{1,9}$/.test(String(s).trim()); }
function toInt(s) {
  s = cleanText(s).replace(/,/g, "");
  return /^-?[0-9]+(\.0+)?$/.test(s) ? parseInt(s, 10) : NaN;
}
function newId() {
  return (S.device || "dev") + "-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
}
function addRecent(list, v) {
  if (!v) return;
  var i = list.indexOf(v);
  if (i >= 0) list.splice(i, 1);
  list.unshift(v);
  if (list.length > 12) list.length = 12;
}
function fmtNum(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

/* ---------------- 出荷リスト ---------------- */
// 納品番号 → 出荷リストの行（同じ納品番号が何行かあれば、納品数を足してまとめる）
function listIndex() {
  var idx = {};
  if (!L) return idx;
  L.rows.forEach(function (r, i) {
    var k = normKey(r.nohin);
    if (!k) return;
    var g = idx[k] || (idx[k] = { key: k, nohin: r.nohin, rows: [], qty: 0, labels: 0, order: i });
    g.rows.push(r);
    g.qty += r.qty > 0 ? r.qty : 0;
    g.labels += r.labels > 0 ? r.labels : 0;
  });
  return idx;
}
function groupHinban(g) {
  var a = [];
  g.rows.forEach(function (r) { if (r.hinban && a.indexOf(r.hinban) < 0) a.push(r.hinban); });
  return a;
}
function masterOf(hinban) {
  if (!L || !hinban) return null;
  return L.master[normKey(hinban)] || null;
}

/* ---------------- 読み取り ---------------- */
// 社内ラベルのQRとして読めるか。読めれば {nohin, hinban, qty}
// 社内ラベルのQRは「納品番号,品番,入数」の3項目と決めている（社内ラベル印刷ツールと同じ）
function parseLabel(raw) {
  return parseLabelAs(raw, DEFAULT_QR);
}
function parseLabelAs(raw, fmt) {
  if (formatError(fmt)) return null;
  var toks = fmt.split(","), parts = raw.split(",").map(function (p) { return p.trim(); });
  if (parts.length !== toks.length) return null;
  var r = { nohin: "", hinban: "", qty: "" };
  toks.forEach(function (t, i) {
    if (t === "納品番号") r.nohin = parts[i];
    else if (t === "品番") r.hinban = parts[i];
    else if (t === "入数") r.qty = parts[i];
  });
  if (!r.nohin || !isQty(r.qty)) return null;
  r.qty = parseInt(r.qty, 10);
  return r;
}
// 社内ラベルの形に合わないとき、その理由。カンマが無いもの（かんばん）は ""
function labelProblem(raw) {
  if (raw.indexOf(",") < 0) return "";
  if (S.kb.mode === "delim" && S.kb.delim === ",") return "";   // かんばんもカンマ区切りのときは見分けられない
  var fmt = DEFAULT_QR, toks = fmt.split(","), parts = raw.split(",").map(function (p) { return p.trim(); });
  if (parts.length !== toks.length) return "項目が " + parts.length + " 個あります（社内ラベルは「" + fmt + "」の " + toks.length + " 個）" +
    (parts.length === 2 ? "。品番の入っていない古い社内ラベルかもしれません。印刷ツールで印刷し直してください" : "");
  var why = "";
  toks.forEach(function (t, i) {
    if (why) return;
    if (t === "納品番号" && !parts[i]) why = "納品番号が空です";
    else if (t === "入数" && !isQty(parts[i])) why = "入数「" + parts[i] + "」が数字ではありません";
  });
  return why || "社内ラベルの形に合いません";
}
// かんばんから納品番号を取り出す（「入っていればOK」のときは null）
function kanbanValue(raw) {
  var k = S.kb;
  if (k.mode === "whole") return raw;
  if (k.mode === "pos") return raw.substr(k.start - 1, k.len);
  if (k.mode === "delim") {
    var p = raw.split(k.delim);
    return p.length >= k.index ? p[k.index - 1] : "";
  }
  return null;
}
function kanbanMatches(raw, nohin) {
  var n = normKey(nohin);
  if (!n) return false;
  var v = kanbanValue(raw);
  if (v !== null) return normKey(v) === n;
  var nr = normKey(raw);
  if (nr.indexOf(n) < 0) return false;
  // 出荷リストのほかの、もっと長い納品番号がかんばんに入っていれば、そちらのかんばん（例：「123」のかんばんに「12」も入っている）
  var idx = listIndex();
  return !Object.keys(idx).some(function (k) { return k !== n && k.length > n.length && nr.indexOf(k) >= 0; });
}
// 「入っていればOK」で使うには納品番号が短すぎるか（短いと、ほかの番号の一部と重なりやすい）
function shortNohinWarning() {
  if (S.kb.mode !== "contains" || !L) return "";
  var short = Object.keys(listIndex()).filter(function (k) { return k.length < 6; });
  if (!short.length) return "";
  return "出荷リストに短い納品番号（" + short.slice(0, 5).join("・") + (short.length > 5 ? " など" : "") + "）があります。" +
    "「入っていればOK」では、ほかの番号の一部と重なって誤品を見逃すことがあります。かんばんの中身がわかったら「決まった位置から取り出す」か「区切り文字で分けて取り出す」に変えてください。";
}
// かんばんだけを読んだとき、出荷リストのどの行かを探す（画面に出すため）
function kanbanLookup(raw) {
  var idx = listIndex(), v = kanbanValue(raw);
  if (v !== null) return { value: v, group: idx[normKey(v)] || null };
  var best = null, nr = normKey(raw);
  Object.keys(idx).forEach(function (k) {
    if (nr.indexOf(k) >= 0 && (!best || k.length > best.key.length)) best = idx[k];
  });
  return { value: best ? best.nohin : "", group: best };
}

// スキャナの受け取り。入力欄を使わず、画面全体でキーを受け取る（入力欄があると Android の日本語入力が割り込み、
// 欄の外に文字が出る・Enter が届かない・遅くなるため）。Enter・Tab が届けば確定。届かなくても、文字が止まったら確定する
// 止まったと見る時間は、文字の間隔の4倍（速いスキャナほど短い。途中で切れないように 150ms より短くしない）
var SCAN_IDLE_MIN = 150, SCAN_IDLE_MAX = 300;
var keyBuf = "", keyLast = 0, keyGap = 0, keyTimer = 0, modalKeySink = null, kbtRaw = "";
function keySink() {
  if (document.getElementById("modalRoot").innerHTML) return modalKeySink;
  if (tab === "scan") return S.input === "scanner" ? function (v) { scanIn(v, "scanner"); } : null;
  if (tab === "set") return function (v) { kbtRaw = v; kbTest(); };
  return null;
}
function keyDone() {
  clearTimeout(keyTimer);
  var v = keyBuf, sink = keySink();
  keyBuf = ""; keyLast = 0; keyGap = 0;
  if (v && sink) sink(v);
}
document.addEventListener("keydown", function (e) {
  var t = e.target;
  if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  if (e.ctrlKey || e.metaKey || !keySink()) return;
  if (e.key === "Enter" || e.key === "Tab" || e.keyCode === 13 || e.keyCode === 9) { e.preventDefault(); keyDone(); return; }
  if (!e.key || e.key.length !== 1) return;
  e.preventDefault();
  var now = Date.now();
  if (keyLast) keyGap = Math.max(keyGap, now - keyLast);
  keyLast = now; keyBuf += e.key;
  clearTimeout(keyTimer);
  // 1文字だけで止まったものは読み取りとみなさない
  keyTimer = setTimeout(function () { if (keyBuf.length < 2) { keyBuf = ""; keyLast = 0; keyGap = 0; } else keyDone(); },
    Math.min(SCAN_IDLE_MAX, Math.max(SCAN_IDLE_MIN, keyGap * 4)));
});
// 手で入れる画面（ここでは入力欄を使う）
function openManual(title, hint, onOk) {
  openModal('<h2 style="margin-top:0">' + esc(title) + '</h2><div class="muted">' + esc(hint) + '</div>' +
    '<input id="mv" class="input" type="url" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="margin-top:8px">' +
    '<div class="row" style="margin-top:14px"><button class="btn grow" id="mc">やめる</button><button class="btn primary grow" id="mo">決定</button></div>',
    function (m) {
      var inp = m.querySelector("#mv");
      var ok = function () { var v = inp.value; closeModal(); onOk(v); };
      m.querySelector("#mc").onclick = closeModal;
      m.querySelector("#mo").onclick = ok;
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); ok(); } });
      setTimeout(function () { inp.focus(); }, 50);
    });
}

// 読んだものを、いまの照合（出荷照合／フリー在庫照合）へ渡す
function scanIn(raw, source) {
  // 画面（数の入力など）を開いている間は、カメラに写ったものを読まない
  if (source === "camera" && document.getElementById("modalRoot").innerHTML) return;
  if (S.work === "free") processFree(raw, source); else processScan(raw, source);
}
function isFree() { return S.work === "free"; }
function curPend() { return isFree() ? S.fpend : S.pend; }
function curRecs() { return isFree() ? F : R; }

/* ---------------- フリー在庫照合 ---------------- */
// ① フリー在庫札（QR＝品番だけ） → ② 社内ラベル（QR＝納品番号,品番,入数）の順に読み、品番が同じか調べる。出荷リストは使わない
function processFree(raw, source) {
  raw = cleanText(raw);
  if (!raw) return;
  if (!S.tanto.trim()) { setResult("ng", "NG　作業者を入れてから読んでください", "記録していません　読んだ内容：" + raw); beep("ng"); return; }
  var lab = parseLabel(raw);
  if (!lab) {
    var why = labelProblem(raw);
    if (why) {
      setResult("ng", "NG　社内ラベルとして読めません（" + why + "）", "読んだ内容：" + raw + "　記録していません");
      beep("ng");
      return;
    }
  }
  var p = S.fpend;
  if (lab && !p) {
    setResult("ng", "NG　先に ① フリー在庫札 を読んでください",
      "いま読んだのは社内ラベルです（読んだ内容：" + raw + "）。順番は ① フリー在庫札 → ② 社内ラベル です。記録していません");
    beep("ng");
    renderSteps();
    return;
  }
  if (!lab) {
    // ① 札（② を待っている間にもう一度札を読んだら、読み直し）
    S.fpend = { hinban: raw, raw: raw, t: nowText() }; saveAll();
    if (lastResult && !lastResult.pair) lastResult = null;
    showResult(true);
    beep("step");
    renderSteps();
    return;
  }
  // ② 社内ラベル → 照合
  S.fpend = null;
  finishFree(p, { raw: raw, nohin: lab.nohin, hinban: lab.hinban, qty: lab.qty });
}
function finishFree(fu, lb) {
  S.fseq += 1;
  var rec = { kind: "free", id: newId(), no: S.fseq, t: nowText(), tanto: S.tanto.trim(), device: S.device.trim(),
    result: "OK", warn: "", fudaHin: fu.hinban, hinban: lb.hinban || "", nohin: lb.nohin, qty: lb.qty,
    fudaRaw: fu.raw, lbRaw: lb.raw, cancel: "", cancelT: "" };
  var ok = !!rec.hinban && normKey(rec.hinban) === normKey(rec.fudaHin);
  if (!ok) {
    rec.result = "NG";
    rec.warn = rec.hinban ? "品番が違う（札 " + rec.fudaHin + "／ラベル " + rec.hinban + "）" : "社内ラベルに品番が入っていない";
  }
  F.push(rec); saveAll();
  if (ok) {
    // OK：品番を大きく（数は札に手書きなので、ここでは聞かない・出さない）
    lastResult = { cls: "ok", pair: true, html: '<span class="big">OK　No.' + rec.no + '　品番が同じです</span>' +
      '<div class="hinq"><b>' + esc(rec.hinban) + '</b></div>' +
      '<div class="subinfo">札の在庫数を書き直すのを忘れずに</div>' };
    beep("ok");
  } else {
    lastResult = { cls: "ng", pair: true, html: '<span class="big">NG　No.' + rec.no + '　品番が違います</span>' +
      '<div class="hinq"><span>札</span><b>' + esc(rec.fudaHin) + '</b></div>' +
      '<div class="hinq"><span>ラベル</span><b>' + esc(rec.hinban || "（品番なし）") + '</b></div>' +
      '<small style="margin-top:6px">記録しました。ラベルの貼り間違い・引き抜く箱の間違いがないか確かめ、正しくしてから ① 札 から読み直してください</small>' };
    beep("ng");
  }
  showResult(true);
  renderSteps(); renderRecent();
}

function processScan(raw, source) {
  raw = cleanText(raw);
  if (!raw) return;
  if (!S.tanto.trim()) { setResult("ng", "NG　作業者を入れてから読んでください", "記録していません　読んだ内容：" + raw); beep("ng"); return; }
  if (!L || !L.rows.length) { setResult("ng", "NG　出荷リストが入っていません", "設定 →「出荷リストを取り込む」で、パソコンから送った出荷リストを入れてください"); beep("ng"); return; }
  if (listIsStale()) { setResult("ng", "NG　出荷リストを確かめてください", "上の黄色い欄で、今日の出荷リストか確かめてから読んでください。記録していません"); beep("ng"); return; }
  var lab = parseLabel(raw), how = source === "camera" ? "カメラ" : "スキャナ";
  if (!lab) {
    // カンマがあるのに社内ラベルの形に合わないものは、かんばんとして扱わない（1つ目に読んだものはそのまま）
    var why = labelProblem(raw);
    if (why) {
      setResult("ng", "NG　社内ラベルとして読めません（" + why + "）",
        "読んだ内容：" + raw + "　／　設定の「社内ラベル（QR）の中身」と合っているか確かめてください。記録していません");
      beep("ng");
      return;
    }
  }
  var cur = { type: lab ? "label" : "kanban", raw: raw, t: nowText() };
  if (lab) { cur.nohin = lab.nohin; cur.hinban = lab.hinban; cur.qty = lab.qty; }
  // 順番は ① 納入かんばん → ② 社内ラベル と決めている
  var p = S.pend;
  if (cur.type === "label" && !p) {
    setResult("ng", "NG　先に ① 納入かんばん を読んでください",
      "いま読んだのは社内ラベルです（読んだ内容：" + raw + "）。順番は ① かんばん → ② 社内ラベル です。記録していません");
    beep("ng");
    renderSteps();
    return;
  }
  if (cur.type === "kanban") {
    // ① かんばん（② を待っている間にもう一度かんばんを読んだら、読み直し）
    S.pend = cur; saveAll();
    // 読んだ内容は「いま読むもの」に出す。結果の欄には前の箱の結果を残す
    if (lastResult && !lastResult.pair) lastResult = null;
    showResult(true);
    beep("step");
    renderSteps();
    return;
  }
  // ② 社内ラベル → 照合

  finishPair(p, cur, how);
}

function finishPair(kb, lb, how) {
  S.seq += 1;
  var rec = { id: newId(), no: S.seq, t: nowText(), tanto: S.tanto.trim(), device: S.device.trim(), list: L ? L.name : "",
    result: "OK", warn: "", nohin: lb.nohin, hinban: lb.hinban || "", qty: lb.qty, kbRaw: kb.raw, lbRaw: lb.raw, cancel: "", cancelT: "" };
  if (!kanbanMatches(kb.raw, lb.nohin)) {
    var v = kanbanValue(kb.raw);
    rec.result = "NG";
    rec.warn = "誤品：かんばんと社内ラベルの納品番号が違う";
    R.push(rec); saveAll();
    setResult("ng", "NG　誤品です（納品番号が違います）",
      "かんばん：" + (v === null ? kb.raw : (v || "（取り出せません）") + "　（読んだ内容 " + kb.raw + "）") +
      "　／　社内ラベル：" + lb.nohin + "　この箱は数に入れていません。正しい組み合わせを読み直してください");
    lastResult.pair = true;
    beep("ng");
    renderSteps(); renderRecent();
    return;
  }
  var idx = listIndex(), g = idx[normKey(rec.nohin)], warns = [];
  if (!g) {
    warns.push("リスト外（出荷リストにない納品番号）");
  } else {
    var hs = groupHinban(g);
    if (rec.hinban && hs.length && !hs.some(function (h) { return normKey(h) === normKey(rec.hinban); }))
      warns.push("品番がリストと違う（リスト：" + hs.join("・") + "）");
    var sum = sumFor(rec.nohin) + rec.qty;
    if (sum > g.qty) warns.push("数量オーバー（納品数 " + fmtNum(g.qty) + "、読んだ合計 " + fmtNum(sum) + "）");
  }
  rec.warn = warns.join("／");
  var wasDone = listDone(buildProgress());
  R.push(rec); saveAll();
  showPairResult(rec, g);
  var pg = buildProgress();
  if (!wasDone && listDone(pg)) { beep("done"); showAllDone(pg); }
  else beep(warns.length ? "warn" : "ok");
  renderSteps(); renderRecent();
}
// 出荷リストの納品番号が全部「完了」か
function listDone(p) { return p.rows.length > 0 && p.c.done === p.rows.length; }
// この納品番号の残り（atKanban：① かんばんを読んだところ）
function remainText(g, sum, boxes, atKanban) {

  if (rq === 0) return atKanban ? "この納品番号はもうそろっています" : "この納品番号はそろいました";
  if (rq < 0) return "納品数より " + fmtNum(-rq) + " 多いです";
  return (rb > 0 ? "あと " + rb + " 箱　" : "") + "残り数量 " + fmtNum(rq);
}
// 「あと ○ 箱」と「残り数量 ○」を、それぞれ途中で折り返さないように
function remainHtml(text) {
  return text.split("　").filter(Boolean).map(function (x) { return '<span style="white-space:nowrap">' + esc(x) + '</span>'; }).join("");
}
function showAllDone(p) {

// 出荷リストの納品番号ごとに、読んだ数量・箱数・状態をまとめる。リスト外の納品番号も別にまとめる
function buildProgress() {
  var idx = listIndex(), groups = {}, outs = {}, ng = 0;
  Object.keys(idx).forEach(function (k) {
    var g = idx[k];
    groups[k] = { g: g, sum: 0, boxes: 0, hinWarn: 0 };
  });
  R.forEach(function (r) {
    if (r.cancel) return;
    if (r.result === "NG") { ng++; return; }
    var k = normKey(r.nohin), x = groups[k];
    if (x) {
      x.sum += r.qty; x.boxes++;
      if (r.warn.indexOf("品番がリストと違う") >= 0) x.hinWarn++;
    } else {
      var o = outs[k] || (outs[k] = { nohin: r.nohin, hinban: [], sum: 0, boxes: 0 });
      o.sum += r.qty; o.boxes++;
      if (r.hinban && o.hinban.indexOf(r.hinban) < 0) o.hinban.push(r.hinban);
    }
  });
  var rows = Object.keys(groups).map(function (k) {
    var x = groups[k];
    x.st = x.sum === 0 ? "none" : x.sum < x.g.qty ? "part" : x.sum === x.g.qty ? "done" : "over";
    return x;
  }).sort(function (a, b) { return a.g.order - b.g.order; });
  var c = { none: 0, part: 0, done: 0, over: 0 };
  rows.forEach(function (x) { c[x.st]++; });
  var outList = Object.keys(outs).map(function (k) { return outs[k]; });
  var hinWarn = rows.filter(function (x) { return x.hinWarn; }).length;
  return { rows: rows, outs: outList, ng: ng, c: c, hinWarn: hinWarn,
    allDone: rows.length > 0 && c.done === rows.length && !outList.length && !hinWarn };
}

// 「納品番号」「品番」「納品数」のある行を見出しとみなす。「種類」列が「マスタ」の行は品番マスタ（品番・機種・通函最大入り数）
function parseListCsv(text, fileName) {

var FRONT_RE = /front|user|facetime|前面|フロント|内側/i;
function qrCamStream() {
  var mode = S.qrFacing === "user" ? "user" : "environment";
  var size = { width: { ideal: 1280 }, height: { ideal: 720 } };

        // 名前でわからなければ「もう一方ではない名前のカメラ」。名前が無ければ順番（背面＝最後、前面＝最初）

        QRLINK.draw(m.querySelector("#sendQr"), chunks[i], 840);
        m.querySelector("#sendNo").textContent = (i + 1) + " / " + chunks.length + " 枚目";
        m.querySelector("#sendPrev").disabled = i === 0; m.querySelector("#sendNext").disabled = i === chunks.length - 1;
      };
      m.querySelector("#sendPrev").onclick = function () { if (i > 0) { i--; show(); } };
      m.querySelector("#sendNext").onclick = function () { if (i < chunks.length - 1) { i++; show(); } };
      m.querySelector("#sendClose").onclick = function () { closeModal(); render(); };
      show();
    });
}

    (list.loadDay ? "積込日：" + list.loadDay + (list.loadDay !== todayText() ? "（今日ではありません）" : "（今日）") + "\n" : "") +
    (bad ? "（納品番号か納品数がない " + bad + " 行は入れていません）\n" : "");
  var live = R.filter(function (r) { return !r.cancel; }).length;
  if (L && R.length) {
    // 記録がある：リストだけ差し替える（直前の変更）か、新しい出荷として記録を消すか
    openModal('<h2 style="margin-top:0">出荷リストを取り込む</h2><div class="card" style="white-space:pre-wrap">' + esc(msg) + '</div>' +
      '<div class="muted">この端末に記録が ' + R.length + ' 件（取消以外 ' + live + ' 件）あります。</div>' +
      '<button class="btn primary block" id="lk" style="margin-top:12px">記録は残して、リストだけ差し替える<br>（納期変更・追加で出荷リストが新しくなった）</button>' +
      '<button class="btn danger block" id="ln" style="margin-top:10px">記録を消して、新しい出荷を始める</button>' +
      '<button class="btn block" id="lc" style="margin-top:10px">やめる</button>',
      function (m) {
        m.querySelector("#lc").onclick = closeModal;
        m.querySelector("#lk").onclick = function () { L = list; saveAll(); closeModal(); lastResult = null; render(); alert("出荷リストを差し替えました。記録はそのままです。"); };
        m.querySelector("#ln").onclick = function () {

          alert("出荷リストを入れました。記録を消して、新しい出荷を始めます。");
        };
      });
    return;
  }
  if (!confirm(msg + "\nこの出荷リストを入れますか？")) return;
  L = list; S.pend = null; lastResult = null; saveAll(); render();
}
// ほかの端末の記録CSVを取り込む（ID が同じ記録は二重に入れない）
function importRecordsCsv(text) {
  var rows = parseCsv(text);
  if (!rows.length) return { error: "中身がありません" };
  var h = rows[0].map(function (x) { return x.trim(); });
  var col = function (name) { return h.indexOf(name); };
  if (col("札の品番") >= 0) return { error: "フリー在庫照合の記録CSVです（出荷照合の記録には入れられません）" };
  if (col("納品番号") < 0 || col("入数") < 0 || col("結果") < 0 || col("ID") < 0) return { error: "2点照合の記録CSVではありません" };
  var have = {}, added = 0, skipped = 0;
  R.forEach(function (r) { have[r.id] = r; });
  rows.slice(1).forEach(function (c) {
    var g = function (name) { var i = col(name); return i >= 0 && i < c.length ? c[i].trim() : ""; };
    var r = { id: g("ID"), no: g("No."), t: g("日時"), tanto: g("作業者"), result: g("結果") === "NG" ? "NG" : "OK", warn: g("注意"),
      nohin: g("納品番号"), hinban: g("品番"), qty: toInt(g("入数")), kbRaw: g("かんばん（読んだ内容）"), lbRaw: g("社内ラベル（読んだ内容）"),
      cancel: g("取消"), cancelT: g("取消日時"), list: g("出荷リスト"), device: g("端末名") || "取込" };
    if (!r.id || !r.nohin) return;
    if (!(r.qty >= 0)) r.qty = 0;
    var old = have[r.id];
    if (old) {
      // 向こうで取り消した記録は、こちらでも取り消しにする
      if (r.cancel && !old.cancel) { old.cancel = r.cancel; old.cancelT = r.cancelT; }
      skipped++; return;
    }
    have[r.id] = r;
    R.push(r); added++;
  });
  R.sort(function (a, b) { return a.t < b.t ? -1 : a.t > b.t ? 1 : 0; });
  return { added: added, skipped: skipped };
}
function pickFile(accept, cb) {
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = accept;
  inp.onchange = function () { if (inp.files && inp.files[0]) cb(inp.files[0]); };
  inp.click();
}

function kbMemo(mode) {
  var m = KB_MODES.filter(function (x) { return x.v === mode; })[0];
  return m ? m.memo : "";
}
function kbTest() {
  var raw = cleanText(kbtRaw), el = document.getElementById("kbr");
  if (!raw) { el.textContent = "まだ読んでいません"; return; }
  if (parseLabel(raw)) { el.innerHTML = "これは社内ラベルのQRとして読めます（かんばんではありません）：" + esc(raw); return; }
  if (labelProblem(raw)) { el.innerHTML = "社内ラベルのQRのようですが、読めません（" + esc(labelProblem(raw)) + "）<br>読んだ内容：<b>" + esc(raw) + "</b>"; return; }
  var lk = kanbanLookup(raw), v = kanbanValue(raw);
  el.innerHTML = "読んだ内容：<b>" + esc(raw) + "</b>（" + raw.length + " 文字）<br>" +
    (v === null ? "" : "取り出した納品番号：<b>" + esc(v || "（取り出せません）") + "</b><br>") +
    (L ? (lk.group ? "出荷リスト：No." + esc(lk.group.rows[0].no) + "　納品番号 " + esc(lk.group.nohin) + "　" + esc(groupHinban(lk.group).join("・")) :
      "出荷リストに合う納品番号はありません") : "（出荷リストが入っていないので、リストとは比べていません）");
}
function bindSet() {
  document.getElementById("impL").onclick = importListFile;
  document.getElementById("qrRcv").onclick = openQrReceive;
  document.getElementById("qrSend").onclick = openQrSend;
  var dev = document.getElementById("dev");
  dev.onchange = function () { S.device = dev.value.trim(); saveAll(); };
  document.getElementById("snd").onchange = function (e) { S.sound = e.target.checked; saveAll(); };
  document.getElementById("sndTest").onclick = function () { beep("ok"); };
  var kbm = document.getElementById("kbm");
  kbm.onchange = function () {
    S.kb.mode = kbm.value; saveAll();
    document.getElementById("kbPos").classList.toggle("hidden", S.kb.mode !== "pos");
    document.getElementById("kbDel").classList.toggle("hidden", S.kb.mode !== "delim");
    document.getElementById("kbMemo").textContent = kbMemo(S.kb.mode);
    document.getElementById("kbShort").textContent = shortNohinWarning();
    kbTest();
  };
  var num = function (id, key) {
    var el = document.getElementById(id);
    el.oninput = function () { var n = toInt(el.value); if (n >= 1) { S.kb[key] = n; saveAll(); } kbTest(); };
  };
  num("kbs", "start"); num("kbl", "len"); num("kbi", "index");
  var kbd = document.getElementById("kbd");
  kbd.oninput = function () { if (kbd.value) { S.kb.delim = kbd.value; saveAll(); } kbTest(); };
  kbtRaw = "";
  document.getElementById("kbtManual").onclick = function () {
    openManual("かんばんを手で入れて試す", "読み取りと同じように確かめます（記録はしません）。", function (v) { kbtRaw = v; kbTest(); });
  };
  document.getElementById("expRec").onclick = exportRecords;
  document.getElementById("expFree").onclick = exportFreeRecords;
  document.getElementById("clrFree").onclick = function () {
    if (!F.length) { alert("フリー在庫照合の記録はありません。"); return; }
    if (!confirm("フリー在庫照合の記録 " + F.length + " 件を消します。\n先に「フリー在庫照合の記録をCSVで書き出す」をしましたか？")) return;
    if (!confirm("本当に消してよいですか？（元に戻せません）")) return;
    F = []; S.fseq = 0; S.fpend = null; lastResult = null; saveAll(); render();
    alert("フリー在庫照合の記録を消しました。");
  };
  document.getElementById("impRec").onclick = function () {
    pickFile(".csv,text/csv,text/comma-separated-values", function (f) {
      readTextFile(f, function (text) {
        var res = importRecordsCsv(text);
        if (res.error) { alert("取り込めませんでした：" + res.error); return; }
        saveAll(); render();
        alert(res.added + " 件を取り込みました。" + (res.skipped ? "\n（すでにある " + res.skipped + " 件は入れていません）" : ""));
      });
    });
  };
  document.getElementById("expSet").onclick = function () {
    shareFile("2点照合_読み方の設定_" + stamp() + ".json", JSON.stringify({ type: "niten-settings", version: 1, kb: S.kb }, null, 2), "application/json");
  };
  document.getElementById("impSet").onclick = function () {
    pickFile(".json,application/json", function (f) {
      readTextFile(f, function (text) {
        var d = null;
        try { d = JSON.parse(text); } catch (e) { d = null; }
        if (!d || d.type !== "niten-settings" || !d.kb) { alert("読み方の設定のファイルではありません。"); return; }
        if (!confirm("かんばんの読み方を、ファイルの内容に置き換えますか？")) return;
        S.kb = d.kb;
        var keepDev = S.device;
        saveAll(); loadAll(); S.device = keepDev; render();
      });
    });
  };
  document.getElementById("clr").onclick = function () {
    if (!R.length && !L) { alert("記録も出荷リストもありません。"); return; }
    if (!confirm("記録 " + R.length + " 件と出荷リストを全部消して、新しい出荷を始めます。\n" +
      (R.length ? "先に「記録をCSVで書き出す」（または「記録をQRで出す」）をしましたか？" : ""))) return;
    if (!confirm("本当に消してよいですか？（元に戻せません）")) return;
    // 前の出荷リストのまま次の出荷を読まないように、出荷リストも消す
    R = []; L = null; S.seq = 0; S.pend = null; lastResult = null; saveAll(); render();
    alert("消しました。次の出荷の出荷リストを取り込んでください。");
  };
}

/* ---------------- モーダル・画面の切り替え ---------------- */
function openModal(html, onMount) {
  modalKeySink = null;
  var root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="modal-bg"><div class="modal">' + html + '</div></div>';
  var bg = root.firstChild;
  bg.addEventListener("click", function (e) { if (e.target === bg) closeModal(); });
  if (onMount) onMount(bg.firstChild);
}
function closeModal() { stopModalCam(); modalKeySink = null; document.getElementById("modalRoot").innerHTML = ""; }

function render() {
  stopCamera();
  var app = document.getElementById("app");
  if (tab === "scan") { app.innerHTML = renderScan(); bindScan(); }
  else if (tab === "prog") { app.innerHTML = renderProg(); bindProg(); }
  else if (tab === "list") { app.innerHTML = renderList(); bindList(); }
  else { app.innerHTML = renderSet(); bindSet(); }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
    b.classList.toggle("sel", b.getAttribute("data-tab") === tab);
  });
}
Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
  b.onclick = function () { tab = b.getAttribute("data-tab"); closeModal(); render(); window.scrollTo(0, 0); };
});

loadAll();
render();

// アプリを端末に保存する（2回目からはネットなしで起動できる）
if ("serviceWorker" in navigator && location.protocol === "https:") {
  // 新しい版が入ったら開き直す（1回開くだけで新しい版になる）。はじめて入れたときは開き直さない
  var hadSw = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (!hadSw || reloaded) return;
    reloaded = true;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js").then(function (reg) {
    // アプリを閉じずに戻ってきたときも、新しい版を確かめる
    document.addEventListener("visibilitychange", function () { if (!document.hidden) reg.update().catch(function () { }); });
  }).catch(function () { });
}
